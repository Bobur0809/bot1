name: checker

# 24/7 ishlash: har run ~5h45m ishlaydi, keyin o'zini qayta ishga tushiradi.
# Zaxira sifatida har 6 soatda cron ham ishga tushiradi (agar zanjir uzilsa).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  actions: write      # o'zini qayta ishga tushirish uchun
  contents: read

concurrency:
  group: checker-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O'rnatish
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          CHECKER_TOKEN:   ${{ secrets.CHECKER_TOKEN }}
          FLAG_SECRET:     ${{ secrets.FLAG_SECRET }}
          LINK_SECRET:     ${{ secrets.LINK_SECRET }}
          SITE_URL:        ${{ secrets.SITE_URL }}
          CHALLENGE_ID:    ${{ secrets.CHALLENGE_ID }}
          ADMIN_CHAT_ID:   ${{ secrets.ADMIN_CHAT_ID }}
          ANNOUNCE_CHAT_ID: ${{ secrets.ANNOUNCE_CHAT_ID }}
          DEADLINE:        ${{ secrets.DEADLINE }}
          TASK_TYPE:       ${{ secrets.TASK_TYPE }}
          FLAG_PREFIX:     ${{ secrets.FLAG_PREFIX }}
          # Ball formulasi: 1-o'rin MAX, har keyingi -STEP, MIN'dan kam emas
          MAX_POINTS: "500"
          POINTS_STEP: "10"
          MIN_POINTS: "100"
          # Eski STEP (bir martalik qayta hisoblash uchun — eski ballar yangisiga moslanadi)
          OLD_POINTS_STEP: "50"
          RUN_SECONDS: "20700"
        run: python checker.py

      - name: Keyingi runni ulash (zanjir)
        # Bekor qilinganda qayta ishga tushmaydi; xato yoki muddat tugaganda ulanadi
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run checker.yml
