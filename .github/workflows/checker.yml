name: checker

# 24/7 ishlash: har run ~5h45m ishlaydi, keyin o'zini qayta ishga tushiradi.
# Zaxira sifatida har 6 soatda cron ham ishga tushiradi (agar zanjir uzilsa).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  actions: write      # o'zini qayta ishga tushirish uchun
  contents: read

concurrency:
  group: checker-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TASK_TYPE: web        # web = 64base shop havola; rev = seyf binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O'rnatish
        run: pip install -r requirements.txt

      - name: Generatorni tiklash (faqat rev task)
        id: gen
        if: ${{ env.TASK_TYPE == 'rev' }}
        env:
          REV_PATCH_B64: ${{ secrets.REV_PATCH_B64 }}
        run: |
          test -n "$REV_PATCH_B64" || { echo "REV_PATCH_B64 secret qo'shilmagan"; exit 1; }
          echo "$REV_PATCH_B64" | base64 -d > rev_patch.py

      - name: Botni ishga tushirish
        id: bot
        env:
          CHECKER_TOKEN:    ${{ secrets.CHECKER_TOKEN }}
          FLAG_SECRET:      ${{ secrets.FLAG_SECRET }}
          LINK_SECRET:      ${{ secrets.LINK_SECRET }}   # web: saytdagi bilan bir xil
          SITE_URL:         ${{ secrets.SITE_URL }}      # web: https://base64-shop.onrender.com
          TASK_TYPE:        web
          FLAG_PREFIX:      shop_
          # Task nomi: yangi task qo'shilganda shu yerni o'zgartiring (eski ballar saqlanadi)
          CHALLENGE_ID:     webshop
          ADMIN_CHAT_ID:    ${{ secrets.ADMIN_CHAT_ID }}
          ANNOUNCE_CHAT_ID: ${{ secrets.ANNOUNCE_CHAT_ID }}
          DEADLINE:         ${{ secrets.DEADLINE }}
          # Ball formulasi: 1-o'rin MAX, har keyingi -STEP, MIN'dan kam emas
          MAX_POINTS: "500"
          POINTS_STEP: "10"
          MIN_POINTS: "100"
          # Eski STEP (bir martalik qayta hisoblash uchun — eski ballar yangisiga moslanadi)
          OLD_POINTS_STEP: "50"
          RUN_SECONDS: "20700"
        run: python checker.py

      - name: Keyingi runni ulash (zanjir)
        # Bot xatosiz tugasa (muddat) ulaydi; xato/bekor bo'lsa ulamaydi (cheksiz aylanmasin)
        if: ${{ !cancelled() && steps.bot.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run checker.yml
